# Copy to server.toml and run each server with SRP_CONFIG=server.toml.
# For remote hosting, set bind_host to 0.0.0.0 and public_host to your reachable host.
bind_host = "127.0.0.1"
public_host = "127.0.0.1"

[browser_server]
port = 80

[login_server]
port = 1234

[lobby_server]
port = 1235

[match_server]
port = 1236
# Optional per-server host overrides:
# bind_host = "0.0.0.0"
# public_host = "match.example.com"
