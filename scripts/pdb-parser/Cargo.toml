[package]
name = "pdb-parser"
version.workspace = true
edition.workspace = true

[dependencies]
clap = { workspace = true }

pdb = { package = "pdb2", git = "https://github.com/afranchuk/pdb", rev = "384c165" }

pdb-addr2line-orig = { package = "pdb-addr2line", version = "0.11.2" }

# Modified version which:
# 1. Prints arguments in the way `xray` expects: u32, i32, pcstr, etc.
# 2. Adds `args_count` helper function
pdb-addr2line = { git = "https://github.com/srp-survarium/pdb-addr2line", rev = "4118c54cf7f9e13ebda9803de1f3106338060c8d" }

bitflags = "2.9.2"
chrono = "0.4.42"

[lints]
workspace = true
